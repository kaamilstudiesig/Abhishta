# Nginx server block for the static site (if the host runs Nginx instead of Apache).
# Point `root` at the folder the out/ files were uploaded to.
server {
    listen 80;
    server_name abhishtaagrifarmstay.com www.abhishtaagrifarmstay.com;
    root /var/www/html/abhishta;   # change to the upload folder
    index index.html;

    location = /field-notes { return 301 /virtualtour/; }
    location / { try_files $uri $uri/ $uri.html =404; }
    error_page 404 /404.html;

    location /_next/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~* \.(webp|jpg|mp4)$ { add_header Cache-Control "public, max-age=2592000"; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
